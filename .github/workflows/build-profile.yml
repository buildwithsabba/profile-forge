name: Build profile art

# The full pipeline, including background removal. Runs when the photo or
# the details change -- not on a schedule, because the portrait and the card
# are static art. The heatmap has its own lighter workflow.
"on":
  push:
    branches: [main]
    paths:
      - "profile.yml"
      - "assets/photo.*"
      - "scripts/**"
      - ".github/workflows/build-profile.yml"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: profile-art
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # "Use this template" commits every file at once, which matches the
      # path filter and starts a build before anyone could upload a photo.
      # Failing there would greet every new user with a red X. So finish
      # green, and say what to do next.
      - name: Look for your photo
        id: photo
        run: |
          if ls assets/photo.* >/dev/null 2>&1; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
            {
              echo "### Waiting for your photo"
              echo
              echo "Upload a picture of yourself to \`assets/\` named \`photo.jpg\`"
              echo "(png, heic and webp work too). That commit starts the build."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::notice title=Waiting for your photo::Upload assets/photo.jpg to build your profile art."
          fi

      - uses: actions/setup-python@v7
        if: steps.photo.outputs.found == 'true'
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - name: Install dependencies
        if: steps.photo.outputs.found == 'true'
        run: pip install -r scripts/requirements.txt

      # rembg downloads a ~176 MB model on first use. Cached, later builds
      # skip that download entirely.
      - name: Cache the background-removal model
        if: steps.photo.outputs.found == 'true'
        uses: actions/cache@v6
        with:
          path: ~/.u2net
          key: u2net-model-v1

      - name: Check profile.yml before doing any work
        if: steps.photo.outputs.found == 'true'
        run: python scripts/config.py

      - name: Prepare the photo
        if: steps.photo.outputs.found == 'true'
        run: python scripts/prep_photo.py

      - name: Render the portrait and the card
        if: steps.photo.outputs.found == 'true'
        run: |
          python scripts/make_ascii_svg.py
          python scripts/make_info_card.py

      - name: Fetch contributions and render the heatmap
        if: steps.photo.outputs.found == 'true'
        env:
          GH_USER: ${{ github.repository_owner }}
        run: |
          python scripts/fetch_contributions.py
          python scripts/render_heatmap_svg.py

      - name: Solve the README display widths
        if: steps.photo.outputs.found == 'true'
        run: python scripts/render_readme.py

      - name: Verify the output
        if: steps.photo.outputs.found == 'true'
        run: python scripts/verify.py

      - uses: stefanzweifel/git-auto-commit-action@v7
        if: steps.photo.outputs.found == 'true'
        with:
          commit_message: "chore: rebuild profile art [skip ci]"
          file_pattern: >-
            README.md ascii-portrait.svg info-card.svg contrib-heatmap.svg
            data/contributions.json
