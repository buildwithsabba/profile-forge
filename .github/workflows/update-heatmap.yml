name: Update heatmap

# Just the calendar, daily. Two light dependencies, no model download.
"on":
  schedule:
    - cron: "17 6 * * *"     # ~06:17 UTC
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: profile-art
  cancel-in-progress: false

jobs:
  heatmap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - run: pip install requests beautifulsoup4 PyYAML

      - env:
          GH_USER: ${{ github.repository_owner }}
        run: |
          python scripts/fetch_contributions.py
          python scripts/render_heatmap_svg.py

      - uses: stefanzweifel/git-auto-commit-action@v7
        with:
          # [skip ci] stops the bot's own commit from retriggering anything.
          commit_message: "chore: refresh contribution graph [skip ci]"
          file_pattern: "data/contributions.json contrib-heatmap.svg"
